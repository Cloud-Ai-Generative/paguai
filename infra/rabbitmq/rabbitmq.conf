# RabbitMQ da PagUai (laboratório).
# Ao subir, o broker cria o usuário, a exchange e as filas descritos em definitions.json.
# Assim as filas já existem antes de o monólito publicar o primeiro evento, e nenhum evento
# se perde por "não havia ninguém para recebê-lo".
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
