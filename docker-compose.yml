# PagUai, Sprint 3: mensageria. O monólito publica eventos no RabbitMQ; Notificações e Extrato consomem.
# Sobe tudo com:  docker compose up -d --build
#   Porta de entrada (gateway YARP):           http://localhost:8080
#   Monólito modular, direto (Scalar):          http://localhost:8081
#   Serviço de Extrato, direto (Scalar):        http://localhost:8082
#   Interface do RabbitMQ (paguai / paguai_dev_123): http://localhost:15672
#   Caixa de e-mails (Mailpit):                 http://localhost:8025
#   Mock do contrato do Extrato (Prism):        docker compose --profile mock up -d  →  http://localhost:4010
#
# Vindo da Sprint 2? Comece limpo:  docker compose down -v  (apaga o volume do banco; os dados são fictícios)
#
# Porta ocupada na sua máquina? Troque sem editar este arquivo, por exemplo:
#   PAGUAI_API_PORT=9080 docker compose up -d
# Variáveis: PAGUAI_API_PORT, PAGUAI_MONOLITO_PORT, PAGUAI_EXTRATO_PORT, PAGUAI_DB_PORT,
#            PAGUAI_RABBITMQ_PORT, PAGUAI_RABBITMQ_UI_PORT, PAGUAI_MAIL_UI_PORT, PAGUAI_SMTP_PORT, PAGUAI_MOCK_PORT

services:
  gateway:
    build:
      context: .
      args:
        PROJETO: PagUai.Gateway
    container_name: paguai-gateway
    restart: unless-stopped
    ports:
      - "${PAGUAI_API_PORT:-8080}:8080"
    environment:
      Destinos__Monolito: "http://api:8080"
      Destinos__Extrato: "http://extrato:8080"
    depends_on:
      - api
      - extrato

  api:
    build:
      context: .
      args:
        PROJETO: PagUai.Api
    container_name: paguai-api
    restart: unless-stopped
    ports:
      - "${PAGUAI_MONOLITO_PORT:-8081}:8080"
    environment:
      ConnectionStrings__PagUai: "Host=postgres;Port=5432;Database=paguai;Username=paguai;Password=paguai_dev_123;Gss Encryption Mode=Disable"
      # Sprint 3: o monólito publica ContaAberta e PagamentoAprovado na exchange paguai.eventos.
      ConnectionStrings__RabbitMq: "amqp://paguai:paguai_dev_123@rabbitmq:5672"
      # Aumente para ver o monólito inteiro ficar lento (Sprints 6 e 9).
      Antifraude__LatenciaMs: "300"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  extrato:
    build:
      context: .
      args:
        PROJETO: PagUai.Extrato
    container_name: paguai-extrato
    restart: unless-stopped
    ports:
      - "${PAGUAI_EXTRATO_PORT:-8082}:8080"
    environment:
      # Sprint 3: o Extrato tem banco próprio (database extrato), montado com os eventos da fila extrato.
      # Ele não chama mais o monólito.
      ConnectionStrings__Extrato: "Host=postgres;Port=5432;Database=extrato;Username=paguai;Password=paguai_dev_123;Gss Encryption Mode=Disable"
      ConnectionStrings__RabbitMq: "amqp://paguai:paguai_dev_123@rabbitmq:5672"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Sprint 3: o serviço de Notificações (Worker Service, sem porta HTTP). Consome a fila notificacoes.
  notificacoes:
    build:
      context: .
      args:
        PROJETO: PagUai.Notificacoes
    container_name: paguai-notificacoes
    restart: unless-stopped
    environment:
      ConnectionStrings__Notificacoes: "Host=postgres;Port=5432;Database=notificacoes;Username=paguai;Password=paguai_dev_123;Gss Encryption Mode=Disable"
      ConnectionStrings__RabbitMq: "amqp://paguai:paguai_dev_123@rabbitmq:5672"
      Notificacoes__SmtpHost: "mailpit"
      Notificacoes__SmtpPort: "1025"
      # Mude para "true" e rode  docker compose up -d notificacoes  para ver retry e dead letter.
      # Até a Sprint 2, esta falha desfazia o PIX. Agora o PIX conclui e o e-mail espera na fila.
      Notificacoes__SimularFalha: "false"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  rabbitmq:
    image: rabbitmq:4-management
    container_name: paguai-rabbitmq
    hostname: paguai-rabbitmq   # o RabbitMQ guarda os dados pelo nome do host; fixo, para não "esquecer" as filas
    ports:
      - "${PAGUAI_RABBITMQ_PORT:-5672}:5672"     # AMQP (os serviços)
      - "${PAGUAI_RABBITMQ_UI_PORT:-15672}:15672" # interface web
    volumes:
      # Usuário, exchange, filas e ligações criados ao subir. Veja infra/rabbitmq/definitions.json.
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - paguai-mensagens:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20

  postgres:
    image: postgres:17-alpine
    container_name: paguai-postgres
    environment:
      POSTGRES_DB: paguai
      POSTGRES_USER: paguai
      POSTGRES_PASSWORD: paguai_dev_123   # senha só para o laboratório local
    ports:
      - "${PAGUAI_DB_PORT:-5432}:5432"
    volumes:
      - paguai-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paguai -d paguai"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: paguai-mailpit
    ports:
      - "${PAGUAI_MAIL_UI_PORT:-8025}:8025"   # interface web
      - "${PAGUAI_SMTP_PORT:-1025}:1025"   # SMTP

  # API FIRST: um mock que responde exatamente o que o contrato descreve, antes de o código existir.
  # Só sobe com o perfil "mock":  docker compose --profile mock up -d mock
  mock:
    image: stoplight/prism:5
    container_name: paguai-mock-extrato
    profiles: ["mock"]
    # --multiprocess=false: a imagem do Prism 5 falha ao iniciar no modo com vários processos.
    command: mock -h 0.0.0.0 --multiprocess=false /contratos/extrato.openapi.yaml
    volumes:
      - ./contratos:/contratos:ro
    ports:
      - "${PAGUAI_MOCK_PORT:-4010}:4010"

volumes:
  paguai-dados:
  paguai-mensagens:
