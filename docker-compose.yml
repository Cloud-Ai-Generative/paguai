# PagUai, Sprint 2: Strangler Fig. O gateway fica na frente; a rota do extrato vai para o
# primeiro serviço extraído do monólito.
# Sobe tudo com:  docker compose up -d --build
#   Porta de entrada (gateway YARP):           http://localhost:8080
#   Monólito modular, direto (Scalar):          http://localhost:8081
#   Serviço de Extrato, direto (Scalar):        http://localhost:8082
#   Caixa de e-mails (Mailpit):                 http://localhost:8025
#   Mock do contrato do Extrato (Prism):        docker compose --profile mock up -d  →  http://localhost:4010
#
# Porta ocupada na sua máquina? Troque sem editar este arquivo, por exemplo:
#   PAGUAI_API_PORT=9080 docker compose up -d
# Variáveis: PAGUAI_API_PORT, PAGUAI_MONOLITO_PORT, PAGUAI_EXTRATO_PORT, PAGUAI_DB_PORT,
#            PAGUAI_MAIL_UI_PORT, PAGUAI_SMTP_PORT, PAGUAI_MOCK_PORT

services:
  gateway:
    build:
      context: .
      args:
        PROJETO: PagUai.Gateway
    container_name: paguai-gateway
    restart: unless-stopped
    ports:
      - "${PAGUAI_API_PORT:-8080}:8080"
    environment:
      Destinos__Monolito: "http://api:8080"
      Destinos__Extrato: "http://extrato:8080"
      # Strangler Fig: para onde vai GET /contas/{id}/extrato?
      #   "servico"  → serviço de Extrato (novo)
      #   "monolito" → Extrato antigo, dentro do monólito (voltar atrás sem mudar código)
      Strangler__Extrato: "servico"
    depends_on:
      - api
      - extrato

  api:
    build:
      context: .
      args:
        PROJETO: PagUai.Api
    container_name: paguai-api
    restart: unless-stopped
    ports:
      - "${PAGUAI_MONOLITO_PORT:-8081}:8080"
    environment:
      ConnectionStrings__PagUai: "Host=postgres;Port=5432;Database=paguai;Username=paguai;Password=paguai_dev_123;Gss Encryption Mode=Disable"
      Notificacoes__SmtpHost: "mailpit"
      Notificacoes__SmtpPort: "1025"
      # Mude para "true" para ver a dor da Sprint 3 (falha na notificação derruba a transferência).
      Notificacoes__SimularFalha: "false"
      # Aumente para ver o monólito inteiro ficar lento (Sprints 6 e 9).
      Antifraude__LatenciaMs: "300"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  extrato:
    build:
      context: .
      args:
        PROJETO: PagUai.Extrato
    container_name: paguai-extrato
    restart: unless-stopped
    ports:
      - "${PAGUAI_EXTRATO_PORT:-8082}:8080"
    environment:
      # O Extrato não tem banco: pergunta ao monólito (Contas e Pagamentos) por HTTP.
      Monolito__Url: "http://api:8080"

  postgres:
    image: postgres:17-alpine
    container_name: paguai-postgres
    environment:
      POSTGRES_DB: paguai
      POSTGRES_USER: paguai
      POSTGRES_PASSWORD: paguai_dev_123   # senha só para o laboratório local
    ports:
      - "${PAGUAI_DB_PORT:-5432}:5432"
    volumes:
      - paguai-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paguai -d paguai"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: paguai-mailpit
    ports:
      - "${PAGUAI_MAIL_UI_PORT:-8025}:8025"   # interface web
      - "${PAGUAI_SMTP_PORT:-1025}:1025"   # SMTP

  # API FIRST: um mock que responde exatamente o que o contrato descreve, antes de o código existir.
  # Só sobe com o perfil "mock":  docker compose --profile mock up -d mock
  mock:
    image: stoplight/prism:5
    container_name: paguai-mock-extrato
    profiles: ["mock"]
    command: mock -h 0.0.0.0 /contratos/extrato.openapi.yaml
    volumes:
      - ./contratos:/contratos:ro
    ports:
      - "${PAGUAI_MOCK_PORT:-4010}:4010"

volumes:
  paguai-dados:
