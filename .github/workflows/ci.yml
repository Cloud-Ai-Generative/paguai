name: CI

on:
  push:
    branches: [main]
    tags: ["sprint-*"]
  pull_request:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Testes (unidade e integração com Testcontainers)
        run: dotnet test --no-build -c Release

  docker-compose:
    runs-on: ubuntu-latest
    needs: build-e-testes
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente
        run: docker compose up -d --build

      - name: Esperar a API ficar saudável
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health; then exit 0; fi
            sleep 3
          done
          docker compose logs api
          exit 1

      - name: Teste de fumaça (transferência PIX simulada e saldo)
        run: |
          ANA=$(curl -fs http://localhost:8080/contas | jq -r '.[] | select(.titular | startswith("Ana")) | .id')
          curl -fs -X POST http://localhost:8080/transferencias \
            -H 'content-type: application/json' \
            -d "{\"contaOrigemId\":\"$ANA\",\"chavePixDestino\":\"loja.geraldo@paguai.local\",\"valor\":10}"
          curl -fs http://localhost:8025/api/v1/messages | jq '.total'
          echo "Saldo da Ana (módulo Pagamentos):"
          curl -fs http://localhost:8080/saldos/$ANA | jq '.saldo'

      - name: Logs da API sem avisos conhecidos
        run: |
          docker compose logs api > api.log
          if grep -E "libgssapi|Overriding HTTP_PORTS" api.log; then
            echo "Encontrado aviso que deveria ter sido eliminado"; exit 1
          fi

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar o ambiente
        if: always()
        run: docker compose down -v

  verificacao-ambiente:
    name: Script de verificação (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Executar check-env.ps1 (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\check-env.ps1 > saida.txt 2>&1
          type saida.txt
          findstr /C:"[OK]" saida.txt >nul || exit 1

      - name: Executar check-env.sh (macOS e Linux)
        if: runner.os != 'Windows'
        run: |
          ./scripts/check-env.sh > saida.txt 2>&1 || true
          cat saida.txt
          grep -q "\[OK\]    git" saida.txt
